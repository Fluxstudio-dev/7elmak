<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7elmak</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="icon" href="assets/img/icon.png">

      <style>
        .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background:
      linear-gradient(rgba(24, 14, 13, .18), rgba(24, 14, 13, .18)),
      url("assets/img/heroimg.jpeg") center center / cover no-repeat;
}
* {
  box-sizing: border-box;
   margin: 0;
   padding: 0; 
    text-decoration: none;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    overflow-y: auto;
}



.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  margin-top: 10px;

  width: 100%;
  height: 80px;

  padding: 0 8.5%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  z-index: 9999;

  background: transparent;
  transition: background 0.3s ease, backdrop-filter 0.3s ease;
}


.logo {
 display: flex;
 align-items: center;
 text-decoration: none;
}

.logo img {
 display: block;
 width: 150px;
 height: auto;
 object-fit: contain;
 object-position: left center;
}



nav {
 display: flex;
 align-items: center;
 gap: 24px;
}

nav a {
 color: #f4f4f4;
 text-decoration: none;
 font-size: 10px;
 font-weight: 500;
 letter-spacing: 4px;
 text-transform: uppercase;
 white-space: nowrap;
}
nav a:hover{
 color: #ffb900;
}
.dot {
 width: 5px;
 height: 5px;
 border-radius: 50%;
 background: #ffb900;
 flex: 0 0 auto;
}

/* Center heading */
.headline {
  position: absolute;
  left: 50%;
  top: 47.5%;
  transform: translate(-50%, -50%);
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 4;
  text-align: center;
}

.animated-word {
  display: inline-flex; justify-content: center; align-items: center; gap: 22px;
  font-size: clamp(38px, 3.8vw, 61px); font-weight: 300; letter-spacing: 10px; line-height: 1; white-space: nowrap;
  min-width: 650px;
}

.animated-letter { display:inline-block; opacity:0; transform:translateY(8px); animation:letterWrite .08s ease forwards; }
@keyframes letterWrite { 0%{opacity:0;transform:translateY(8px);filter:blur(4px)} 60%{opacity:1;transform:translateY(-1px);filter:blur(0)} 100%{opacity:1;transform:translateY(0);filter:blur(0)} }
@keyframes letterErase { 0%{opacity:1;transform:translateY(0);filter:blur(0)} 100%{opacity:0;transform:translateY(-6px);filter:blur(3px)} }

.word-first {
  color: #ffb900;
}

.word-second {
  color: #fff;
}

@media (max-width: 900px) {
 .header {
   left: 5%;
   right: 5%;
 }

 nav {
   gap: 12px;
 }

 nav a {
   font-size: 8px;
   letter-spacing: 2px;
 }

 .headline {
   left: 20%;
   gap: 25px;
 }

 .headline .awards,
 .headline .winning {
   letter-spacing: 8px;
 }
}

@media (max-width: 650px) {
 .header {
   top: 18px;
 }

 .logo {
   width: 125px;
   height: 38px;
 }

 .logo img {
   width: 125px;
   max-height: 38px;
 }

 nav {
   display: none;
 }


 
 .headline {
   left: 50%;
   top: 50%;
   transform: translate(-50%, -50%);
   gap: 16px;
 }

 .headline .awards,
 .headline .winning {
   font-size: 30px;
   letter-spacing: 5px;
 }
}


/* =========================
   FOOTER
========================= */

.site-footer {
  position: relative;
  width: 100%;
  height: 76px;
  background: #111111;
  color: #d5d5d5;
  display: flex;
  align-items: center;
  z-index: 10;
}

.footer-content {
  width: 100%;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.copyright {
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
}
.social-links {
  display: flex;
  align-items: center;
  gap: 22px;
}

.social-links a {
  width: 18px;
  height: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #ffffff;
  text-decoration: none;

  font-size: 16px;

  transition: all 0.3s ease;
}

.social-links a:hover {
  color: #ffb900;
  transform: translateY(-2px);
}
@media (max-width: 768px) {
  .site-footer {
    position: relative;
    height: auto;
    min-height: 90px;
  }

  .footer-content {
    padding: 18px 20px;
    flex-direction: column;
    gap: 12px;
    text-align: center;
  }

  .copyright {
    font-size: 12px;
  }

  .social-links {
    gap: 18px;
  }
}
      </style>
</head>

<body>
  <main class="hero">

    <header class="header">
      <a class="logo" href="#">
        <img src="assets/img/logo.png" alt="7elmak">
      </a>

      <nav>
        <a href="#">Home</a>
        <span class="dot"></span>
        <a href="#">About</a>
        <span class="dot"></span>
        <a href="#">Services</a>
        <span class="dot"></span>
        <a href="#">Projects</a>
        <span class="dot"></span>
        <a href="#">Marketing</a>
        <span class="dot"></span>
        <a href="#">Emails</a>
        <span class="dot"></span>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="headline">
      <span class="animated-word">
          <span class="word-first">WEB</span>
          <span class="word-second">DESIGN</span>
      </span>
  </section>

  </main>
  <footer class="site-footer">
    <div class="footer-content">
      <div class="copyright">
        © Copyright 2026 - <a href="#" style="color: #fff;">7elmak</a> IT Solution
      </div>

      <div class="social-links">

        <a href="#" aria-label="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
        </a>
    
    </div>
  </footer>

<script>
document.addEventListener("DOMContentLoaded",function(){
 const word=document.querySelector(".animated-word");
 const services=["WEB DESIGN","WEB DEVELOPMENT","MOBILE APPLICATION","UI/UX","SERVER","GRAPHIC DESIGN","EMAIL","MARKETING"];
 let index=0,isAnimating=false;
 function createLetters(container,text,startDelay=0){[...text].forEach((char,i)=>{const l=document.createElement("span");l.className="animated-letter";l.textContent=char===" "?"\u00A0":char;l.style.animationDelay=`${startDelay+i*.07}s`;container.appendChild(l);});}
 function showService(text){word.innerHTML="";const p=text.split(" "),firstText=p.slice(0,-1).join(" "),secondText=p[p.length-1];if(firstText){const first=document.createElement("span");first.className="word-first";createLetters(first,firstText);word.appendChild(first);}if(secondText){const second=document.createElement("span");second.className="word-second";createLetters(second,secondText,firstText?firstText.length*.07+.05:0);word.appendChild(second);}}
 function eraseWord(callback){const letters=[...word.querySelectorAll(".animated-letter")],total=letters.length;letters.forEach((l,i)=>{l.style.animation="none";l.style.opacity="1";l.style.transform="translateY(0)";setTimeout(()=>{l.style.animation="letterErase .10s ease forwards";},(total-1-i)*45);});setTimeout(callback,total*45+140);}
 function changeWord(){if(isAnimating)return;isAnimating=true;eraseWord(()=>{index=(index+1)%services.length;showService(services[index]);setTimeout(()=>{isAnimating=false;},900);});}
 showService(services[index]);setInterval(changeWord,5000);
});
</script>


</body>
</html>
